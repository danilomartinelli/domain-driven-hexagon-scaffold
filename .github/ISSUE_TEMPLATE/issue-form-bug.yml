name: Bug report
description: Report a bug to help us improve
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The commands or requests that trigger the bug.
      placeholder: |
        1. Run `bun run ...`
        2. Send `POST /v1/users` with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error messages, logs or failing check output. Remove secrets first.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please complete the following information.
      value: |
        - OS: [e.g. macOS 15, Ubuntu 24.04]
        - Bun: [output of `bun --version`]
        - Commit: [output of `git rev-parse --short HEAD`]
        - Docker: [output of `docker --version`, if database or E2E suites are involved]
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched for existing issues and this is not a duplicate
          required: true
