name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Pinned so runner image upgrades are deliberate.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Fast gate: formatting, docs references, lint, types, boundaries and unit tests.
      - name: Check
        run: bun run check
      - name: Broker regression and cleanup ownership
        run: bun run nx run test-runner:test-broker
      - name: Distributed system tests
        run: bun run test:e2e
      # Keep component failures inside the existing required check status.
      - name: Component tests
        run: bun run test:component
