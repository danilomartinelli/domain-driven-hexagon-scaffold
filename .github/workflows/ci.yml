name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: OCI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install tools and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          bun install --frozen-lockfile
      - name: Execute independent Linux images
        run: bun run test:images --platform=${{ matrix.platform }}
      - name: Preserve image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-checks-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            .context/image-checks/*.log
            .context/test-runs/*/run.log
            .context/test-runs/*/result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  quality:
    name: Quality
    # Pinned so runner image upgrades are deliberate.
    runs-on: ubuntu-24.04
    # Keep routine checks bounded; check:full is required locally before commit.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check:ci
  check:
    name: check
    needs: [quality, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require quality and both image architectures
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          IMAGE_RESULT: ${{ needs.images.result }}
        run: test "$QUALITY_RESULT" = success && test "$IMAGE_RESULT" = success
