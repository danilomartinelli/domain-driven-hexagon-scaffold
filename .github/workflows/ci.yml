name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Pinned so runner image upgrades are deliberate.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Fast gate: formatting, docs references, lint, types, boundaries and unit tests.
      - name: Check
        run: bun run check
      - name: Select preservation regression
        id: preservation
        env:
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMPARISON_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/preservation-required.ts --base="$COMPARISON_BASE" --head="$COMPARISON_HEAD"
      - name: Preserve development and sibling environments
        if: steps.preservation.outputs.required == 'true'
        run: bun run nx run test-runner:test-preservation
      - name: Broker regression and cleanup ownership
        run: bun run nx run test-runner:test-broker
      - name: Gateway setup and cleanup ownership
        run: bun run nx run test-runner:test-gateway
      - name: Distributed system tests
        run: bun run test:e2e
      # Keep component failures inside the existing required check status.
      - name: Component tests
        run: bun run test:component

      - name: Independent distribution tests
        run: bun run test:distribution

      - name: Preserve failed run diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-run-diagnostics-${{ github.run_attempt }}
          path: |
            .context/test-runs/*/run.log
            .context/test-runs/*/result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
