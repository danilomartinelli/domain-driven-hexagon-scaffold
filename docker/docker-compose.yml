# Legacy resources only; current commands use generated, scoped Compose configurations.
# Do not delete existing volumes. See docs/database.md.
services:
  postgres:
    image: postgres:18.6-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ddh
    volumes:
      - ddh-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ddh']
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-test:
    image: postgres:18.6-alpine
    profiles: ['test']
    ports:
      - '127.0.0.1:5434:5432'
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ddh_tests
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ddh_tests']
      interval: 2s
      timeout: 5s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '127.0.0.1:5050:80'

volumes:
  ddh-postgres-18:
